<!DOCTYPE html>
<html>
<head>
    <title>RouteLLM-Pro Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f1117; color: #e5e7eb; padding: 40px; }
        h1 { color: #fff; }
        .cards { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; }
        .card { background: #1a1d29; padding: 20px 30px; border-radius: 12px; min-width: 180px; }
        .card h2 { margin: 0; font-size: 28px; color: #4ade80; }
        .card p { margin: 5px 0 0; color: #9ca3af; }
        canvas { max-width: 500px; }
    </style>
</head>
<body>
    <h1>RouteLLM-Pro Dashboard</h1>
    <div class="cards" id="cards"></div>
    <canvas id="tierChart"></canvas>

    <script>
        async function loadStats() {
            const res = await fetch("/stats");
            const data = await res.json();

            const cardsDiv = document.getElementById("cards");
            cardsDiv.innerHTML = `
                <div class="card"><h2>${data.total_queries}</h2><p>Total Queries</p></div>
                <div class="card"><h2>${data.avg_latency}s</h2><p>Avg Latency</p></div>
                <div class="card"><h2>${data.estimated_savings_percent}%</h2><p>Cost Saved vs Always-Frontier</p></div>
                <div class="card"><h2>${data.total_cost_weight}</h2><p>Total Cost Units</p></div>
            `;

            const labels = Object.keys(data.tier_distribution);
            const values = Object.values(data.tier_distribution);

            new Chart(document.getElementById("tierChart"), {
                type: "doughnut",
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ["#4ade80", "#facc15", "#f87171"]
                    }]
                },
                options: {
                    plugins: {
                        legend: { labels: { color: "#e5e7eb" } }
                    }
                }
            });
        }
        loadStats();
    </script>
</body>
</html>
